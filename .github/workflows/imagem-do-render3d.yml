# A IMAGEM DO RENDER 3D NO RUNPOD SERVERLESS (11/10/2026).
#
# Constrói worker/avancado/render3d/Dockerfile (Remotion e Chrome com GL na GPU,
# para os modelos do curso com @remotion/three e o editor avançado) e publica no
# GitHub Container Registry da conta dona do repositório:
#   ghcr.io/<dono>/demandou-render3d:<commit> e :latest
# Roda quando o handler, o Dockerfile ou o package.json do worker mudam, ou à mão.
name: Imagem do render 3D (RunPod)

on:
  workflow_dispatch:
  push:
    paths:
      - "worker/avancado/render3d/**"
      - "worker/package.json"
      - ".github/workflows/imagem-do-render3d.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-do-render3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # As bibliotecas da CUDA e do cuDNN pelo pip passam de 3 GB: abre espaço no disco do runner.
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem
        id: nome
        run: |
          dono=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "imagem=ghcr.io/${dono}/demandou-render3d" >> "$GITHUB_OUTPUT"
          echo "curta=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: worker
          file: worker/avancado/render3d/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.nome.outputs.imagem }}:${{ steps.nome.outputs.curta }}
            ${{ steps.nome.outputs.imagem }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Render 3D (Remotion e Chrome na GPU) da Demandou, para o RunPod Serverless
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.nome.outputs.imagem }}:${{ steps.nome.outputs.curta }}\`" >> "$GITHUB_STEP_SUMMARY"
